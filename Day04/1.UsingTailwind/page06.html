<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div class="bg-red-500 text-white size-25 m-3 p-3 border-5 border-green-500 rounded">Div 1</div>
    <div class="bg-red-500 text-white size-25 m-3 p-3 border-5 border-green-500 rounded-md">Div 2</div>
    <div class="bg-red-500 text-white size-25 m-3 p-3 border-5 border-green-500 rounded-4xl">Div 3</div>
    <div class="bg-red-500 text-white size-25 m-3 p-3 border-5 border-green-500 rounded-full">Div 4</div>
    <div class="bg-red-500 text-white size-25 m-3 p-3 border-5 border-green-500 rounded-e-3xl">Div 5</div>
    <div class="bg-red-500 text-white size-25 m-3 p-3 border-5 border-green-500 rounded-ee-3xl">Div 6</div>
    <div class="bg-blue-400 size-25 relative left-10">1</div>
    <div class="bg-blue-400 size-25 relative left-10">2</div>

    <!-- create 4 divs with absolute position and place them on 4 corners -->
</body>

</html>
